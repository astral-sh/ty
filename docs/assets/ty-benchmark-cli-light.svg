<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 117" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 3.01 seconds; Pyrefly: 2.32 seconds; Pyright: 31.13 seconds; mypy: 29.60 seconds.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }
  </style>
  <g transform="translate(61, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="100"/>
      <line x1="110.501" y1="0" x2="110.501" y2="100"/>
      <line x1="221.002" y1="0" x2="221.002" y2="100"/>
      <line x1="331.502" y1="0" x2="331.502" y2="100"/>
    </g>

    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="115">0s</text>
      <text x="110.501" y="115">10s</text>
      <text x="221.002" y="115">20s</text>
      <text x="331.502" y="115">30s</text>
    </g>

    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Pyright</text>
      <text x="-10" y="91">mypy</text>
    </g>

    <g class="benchmarkBar">
      <rect x="0" y="6" width="33.217" height="13" aria-label="ty: 3.006 seconds"/>
      <rect x="0" y="31" width="25.603" height="13" aria-label="Pyrefly: 2.317 seconds"/>
      <rect x="0" y="56" width="344.000" height="13" aria-label="Pyright: 31.131 seconds"/>
      <rect x="0" y="81" width="327.049" height="13" aria-label="mypy: 29.597 seconds"/>
    </g>

    <g class="benchmarkLabel">
      <text x="39.217" y="16.5" font-weight="bold">3.01s</text>
      <text x="31.603" y="41.5">2.32s</text>
      <text x="350.000" y="66.5">31.13s</text>
      <text x="333.049" y="91.5">29.60s</text>
    </g>
  </g>
</svg>
