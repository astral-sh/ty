<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 117" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 2.79 seconds; Pyrefly: 2.02 seconds; Pyright: 27.17 seconds; mypy: 23.39 seconds.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }
  </style>
  <g transform="translate(61, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="100"/>
      <line x1="126.620" y1="0" x2="126.620" y2="100"/>
      <line x1="253.239" y1="0" x2="253.239" y2="100"/>
    </g>

    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="115">0s</text>
      <text x="126.620" y="115">10s</text>
      <text x="253.239" y="115">20s</text>
    </g>

    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Pyright</text>
      <text x="-10" y="91">mypy</text>
    </g>

    <g class="benchmarkBar">
      <rect x="0" y="6" width="35.264" height="13" aria-label="ty: 2.785 seconds"/>
      <rect x="0" y="31" width="25.577" height="13" aria-label="Pyrefly: 2.020 seconds"/>
      <rect x="0" y="56" width="344.000" height="13" aria-label="Pyright: 27.168 seconds"/>
      <rect x="0" y="81" width="296.188" height="13" aria-label="mypy: 23.392 seconds"/>
    </g>

    <g class="benchmarkLabel">
      <text x="41.264" y="16.5" font-weight="bold">2.79s</text>
      <text x="31.577" y="41.5">2.02s</text>
      <text x="350.000" y="66.5">27.17s</text>
      <text x="302.188" y="91.5">23.39s</text>
    </g>
  </g>
</svg>
