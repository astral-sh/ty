<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 117" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 2.68 seconds; Pyrefly: 2.04 seconds; Pyright: 27.99 seconds; mypy: 25.25 seconds.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }
  </style>
  <g transform="translate(61, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="100"/>
      <line x1="122.901" y1="0" x2="122.901" y2="100"/>
      <line x1="245.802" y1="0" x2="245.802" y2="100"/>
    </g>

    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="115">0s</text>
      <text x="122.901" y="115">10s</text>
      <text x="245.802" y="115">20s</text>
    </g>

    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Pyright</text>
      <text x="-10" y="91">mypy</text>
    </g>

    <g class="benchmarkBar">
      <rect x="0" y="6" width="32.974" height="13" aria-label="ty: 2.683 seconds"/>
      <rect x="0" y="31" width="25.121" height="13" aria-label="Pyrefly: 2.044 seconds"/>
      <rect x="0" y="56" width="344.000" height="13" aria-label="Pyright: 27.990 seconds"/>
      <rect x="0" y="81" width="310.288" height="13" aria-label="mypy: 25.247 seconds"/>
    </g>

    <g class="benchmarkLabel">
      <text x="38.974" y="16.5" font-weight="bold">2.68s</text>
      <text x="31.121" y="41.5">2.04s</text>
      <text x="350.000" y="66.5">27.99s</text>
      <text x="316.288" y="91.5">25.25s</text>
    </g>
  </g>
</svg>
