<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 117" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 3.00 seconds; Pyrefly: 2.29 seconds; Pyright: 32.17 seconds; mypy: 30.52 seconds.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }
  </style>
  <g transform="translate(61, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="100"/>
      <line x1="106.935" y1="0" x2="106.935" y2="100"/>
      <line x1="213.870" y1="0" x2="213.870" y2="100"/>
      <line x1="320.806" y1="0" x2="320.806" y2="100"/>
    </g>

    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="115">0s</text>
      <text x="106.935" y="115">10s</text>
      <text x="213.870" y="115">20s</text>
      <text x="320.806" y="115">30s</text>
    </g>

    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Pyright</text>
      <text x="-10" y="91">mypy</text>
    </g>

    <g class="benchmarkBar">
      <rect x="0" y="6" width="32.123" height="13" aria-label="ty: 3.004 seconds"/>
      <rect x="0" y="31" width="24.488" height="13" aria-label="Pyrefly: 2.290 seconds"/>
      <rect x="0" y="56" width="344.000" height="13" aria-label="Pyright: 32.169 seconds"/>
      <rect x="0" y="81" width="326.334" height="13" aria-label="mypy: 30.517 seconds"/>
    </g>

    <g class="benchmarkLabel">
      <text x="38.123" y="16.5" font-weight="bold">3.00s</text>
      <text x="30.488" y="41.5">2.29s</text>
      <text x="350.000" y="66.5">32.17s</text>
      <text x="332.334" y="91.5">30.52s</text>
    </g>
  </g>
</svg>
