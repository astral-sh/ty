<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 148" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 2.09 seconds; Pyrefly: 2.30 seconds; Zuban: 7.45 seconds; mypy: 52.03 seconds; Pyright: 126.94 seconds. Native discovery, controlled root scope. Default concurrency: ty, Pyrefly, and Zuban automatically select 16 pool threads; mypy has no external checking workers and its native parser can use up to eight threads; Pyright checks in one process. ty 0.0.96.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      .benchmarkLabel {
        fill: #FFFFFF;
      }
    }
  </style>
  <g transform="translate(67, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="125"/>
      <line x1="126.438" y1="0" x2="126.438" y2="125"/>
      <line x1="252.875" y1="0" x2="252.875" y2="125"/>
    </g>
    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="140">0s</text>
      <text x="126.438" y="140">50s</text>
      <text x="252.875" y="140">100s</text>
    </g>
    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Zuban</text>
      <text x="-10" y="91">mypy</text>
      <text x="-10" y="116">Pyright</text>
    </g>
    <g class="benchmarkBar">
      <rect x="0" y="6" width="5.289" height="13" aria-label="ty: 2.092 seconds"/>
      <rect x="0" y="31" width="5.823" height="13" aria-label="Pyrefly: 2.303 seconds"/>
      <rect x="0" y="56" width="18.850" height="13" aria-label="Zuban: 7.454 seconds"/>
      <rect x="0" y="81" width="131.565" height="13" aria-label="mypy: 52.028 seconds"/>
      <rect x="0" y="106" width="321.000" height="13" aria-label="Pyright: 126.940 seconds"/>
    </g>
    <g class="benchmarkLabel">
      <text x="11.289" y="16.5" font-weight="bold">2.09s</text>
      <text x="11.823" y="41.5">2.30s</text>
      <text x="24.850" y="66.5">7.45s</text>
      <text x="137.565" y="91.5">52.03s</text>
      <text x="327.000" y="116.5">126.94s</text>
    </g>
  </g>
</svg>
