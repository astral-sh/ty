<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 117" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 3.03 seconds; Pyrefly: 2.30 seconds; Pyright: 31.25 seconds; mypy: 29.93 seconds.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      .benchmarkLabel {
        fill: #FFFFFF;
      }
    }
  </style>
  <g transform="translate(61, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="100"/>
      <line x1="110.062" y1="0" x2="110.062" y2="100"/>
      <line x1="220.125" y1="0" x2="220.125" y2="100"/>
      <line x1="330.187" y1="0" x2="330.187" y2="100"/>
    </g>

    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="115">0s</text>
      <text x="110.062" y="115">10s</text>
      <text x="220.125" y="115">20s</text>
      <text x="330.187" y="115">30s</text>
    </g>

    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Pyright</text>
      <text x="-10" y="91">mypy</text>
    </g>

    <g class="benchmarkBar">
      <rect x="0" y="6" width="33.316" height="13" aria-label="ty: 3.027 seconds"/>
      <rect x="0" y="31" width="25.325" height="13" aria-label="Pyrefly: 2.301 seconds"/>
      <rect x="0" y="56" width="344.000" height="13" aria-label="Pyright: 31.255 seconds"/>
      <rect x="0" y="81" width="329.450" height="13" aria-label="mypy: 29.933 seconds"/>
    </g>

    <g class="benchmarkLabel">
      <text x="39.316" y="16.5" font-weight="bold">3.03s</text>
      <text x="31.325" y="41.5">2.30s</text>
      <text x="350.000" y="66.5">31.25s</text>
      <text x="335.450" y="91.5">29.93s</text>
    </g>
  </g>
</svg>
