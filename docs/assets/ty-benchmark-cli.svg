<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 142" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant CLI type-checking benchmark</title>
  <desc id="description">ty: 2.08 seconds; Pyrefly: 2.31 seconds; Zuban: 7.61 seconds; mypy: 13.60 seconds; Pyright: 29.82 seconds. Native discovery, controlled root scope, 16-worker limits, ty 0.0.96.</desc>
  <style>
    .benchmarkBar {
      fill: #6340AC;
    }
    .benchmarkLabel {
      fill: #333333;
    }
    .benchmarkGrid {
      stroke: rgba(127, 127, 127, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      .benchmarkLabel {
        fill: #FFFFFF;
      }
    }
  </style>
  <g transform="translate(61, 0)" font-family="Roboto Mono, monospace" font-size="12">
    <g class="benchmarkGrid" aria-hidden="true">
      <line x1="0.000" y1="0" x2="0.000" y2="125"/>
      <line x1="115.360" y1="0" x2="115.360" y2="125"/>
      <line x1="230.720" y1="0" x2="230.720" y2="125"/>
    </g>
    <g class="benchmarkLabel" aria-hidden="true" text-anchor="middle">
      <text x="0.000" y="140">0s</text>
      <text x="115.360" y="140">10s</text>
      <text x="230.720" y="140">20s</text>
    </g>
    <g class="benchmarkLabel" text-anchor="end">
      <text x="-10" y="16" font-weight="bold">ty</text>
      <text x="-10" y="41">Pyrefly</text>
      <text x="-10" y="66">Zuban</text>
      <text x="-10" y="91">mypy</text>
      <text x="-10" y="116">Pyright</text>
    </g>
    <g class="benchmarkBar">
      <rect x="0" y="6" width="24.050" height="13" aria-label="ty: 2.085 seconds"/>
      <rect x="0" y="31" width="26.624" height="13" aria-label="Pyrefly: 2.308 seconds"/>
      <rect x="0" y="56" width="87.758" height="13" aria-label="Zuban: 7.607 seconds"/>
      <rect x="0" y="81" width="156.879" height="13" aria-label="mypy: 13.599 seconds"/>
      <rect x="0" y="106" width="344.000" height="13" aria-label="Pyright: 29.820 seconds"/>
    </g>
    <g class="benchmarkLabel">
      <text x="30.050" y="16.5" font-weight="bold">2.08s</text>
      <text x="32.624" y="41.5">2.31s</text>
      <text x="93.758" y="66.5">7.61s</text>
      <text x="162.879" y="91.5">13.60s</text>
      <text x="350.000" y="116.5">29.82s</text>
    </g>
  </g>
</svg>
