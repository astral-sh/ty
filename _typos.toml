[files]
extend-exclude = [
    # Verbatim root paths, dependency names, and checker output.
    "BENCHMARKS.json",
]

[default.extend-words]

[default]
extend-ignore-re = [
    # Line ignore with trailing "spellchecker:disable-line"
    "(?Rm)^.*#\\s*spellchecker:disable-line$",
    "LICENSEs",
    "ntBre"
]
