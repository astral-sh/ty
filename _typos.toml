[files]
# Preserve original package names, configurations, and failure traces verbatim.
extend-exclude = ["benchmark-results/2026-11-06-ty-0.0.99/**"]

[default.extend-words]

[default]
extend-ignore-re = [
    # Line ignore with trailing "spellchecker:disable-line"
    "(?Rm)^.*#\\s*spellchecker:disable-line$",
    "LICENSEs",
    "ntBre"
]
