name: "Benchmark ARM PGO"

on:
  push:
    branches:
      - charlie/ty-arm-pgo-benchmark

permissions:
  actions: read
  contents: read

jobs:
  arm-pgo:
    name: "Benchmark production ${{ matrix.platform }} ARM64 binaries"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            baseline_run: 31440312350
            pgo_run: 31440423411
            baseline_archive_sha256: 70697993ffa9a4673b2721dd353aea947cba1ac17d74ed87856ef22ac6138ba2
            baseline_binary_sha256: 3b58690bab0864c8c468ac24564171f77efd9eaf581789cd71b26bd938a57c18
            pgo_archive_sha256: 109884b4c69fcbbb22b396502f41dd4ebc59d8de1fe6d41a7a4bb9a7ec196a58
            pgo_binary_sha256: babd5632e6961ffc37dce2b670c9e4b17ab4885779de389c49976ecf8be74ac2
          - platform: Linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            baseline_run: 31440465270
            pgo_run: 31440500538
            baseline_archive_sha256: 5a3f126bbd55a32e3e7fbb5c9e247d0714d46070e54d3d53dc63760fff69711b
            baseline_binary_sha256: cc7dead014b2a890e678b0fb485cca3bb90f4c06fd755ee7307d254461df6e7d
            pgo_archive_sha256: dde9ed33dd5c776918e5836a86a74c5f3ada27542a5cae5687ade5767bb89c3d
            pgo_binary_sha256: b9c24dfe422edb7a4455d3783272607ca1c0f78dd9d3223eebbd8492dc32fb95
    defaults:
      run:
        shell: bash
    steps:
      - name: "Check out benchmark harness"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up native ARM Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: arm64
      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: "Download production baseline"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.baseline_run }}
          name: artifacts-${{ matrix.target }}
          path: ${{ runner.temp }}/ty-arm-pgo/artifacts/baseline
      - name: "Download production PGO binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.pgo_run }}
          name: artifacts-${{ matrix.target }}
          path: ${{ runner.temp }}/ty-arm-pgo/artifacts/pgo
      - name: "Verify production archives, executables, and runner architecture"
        env:
          TARGET: ${{ matrix.target }}
          BASELINE_ARCHIVE_SHA256: ${{ matrix.baseline_archive_sha256 }}
          BASELINE_BINARY_SHA256: ${{ matrix.baseline_binary_sha256 }}
          PGO_ARCHIVE_SHA256: ${{ matrix.pgo_archive_sha256 }}
          PGO_BINARY_SHA256: ${{ matrix.pgo_binary_sha256 }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            aarch64-unknown-linux-gnu) expected_arch="aarch64" ;;
            *) echo "Unexpected target: $TARGET" >&2; exit 1 ;;
          esac

          runner_arch="$(uname -m)"
          if [[ "$runner_arch" != "$expected_arch" ]]; then
            echo "Expected native $expected_arch runner, found $runner_arch" >&2
            exit 1
          fi

          python -c 'import platform; machine = platform.machine(); assert machine in {"arm64", "aarch64"}, machine'

          for variant in baseline pgo; do
            archive="$RUNNER_TEMP/ty-arm-pgo/artifacts/$variant/ty-$TARGET.tar.gz"
            if [[ "$variant" == "baseline" ]]; then
              expected_archive="$BASELINE_ARCHIVE_SHA256"
              expected_binary="$BASELINE_BINARY_SHA256"
            else
              expected_archive="$PGO_ARCHIVE_SHA256"
              expected_binary="$PGO_BINARY_SHA256"
            fi

            archive_hash="$(shasum -a 256 "$archive" | cut -d ' ' -f 1)"
            if [[ "$archive_hash" != "$expected_archive" ]]; then
              echo "Unexpected $variant archive SHA-256: $archive_hash" >&2
              exit 1
            fi

            destination="$RUNNER_TEMP/ty-arm-pgo/verified/$variant"
            mkdir -p "$destination"
            tar -xzf "$archive" -C "$destination" --strip-components=1
            binary="$destination/ty"
            binary_hash="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
            if [[ "$binary_hash" != "$expected_binary" ]]; then
              echo "Unexpected $variant executable SHA-256: $binary_hash" >&2
              exit 1
            fi

            echo "$variant executable: $binary_hash"
            file "$binary"
            "$binary" --version
          done
      - name: "Benchmark pinned held-out projects"
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ty-arm-pgo"
          python scripts/benchmark_arm_pgo.py \
            --baseline "$root/verified/baseline/ty" \
            --pgo "$root/verified/pgo/ty" \
            --workspace "$root/work" \
            --json-output "$root/results.json" \
            --markdown-output "$root/results.md" \
            --pairs 8 \
            --lsp-sessions 6 \
            --warmups 1
      - name: "Publish benchmark summary"
        if: ${{ always() }}
        run: |
          summary="$RUNNER_TEMP/ty-arm-pgo/results.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "Upload benchmark results"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm-pgo-benchmark-results-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ty-arm-pgo/results.json
            ${{ runner.temp }}/ty-arm-pgo/results.md
          if-no-files-found: warn
          retention-days: 7
