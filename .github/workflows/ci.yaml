name: Compare release codegen units

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Reuse binaries from a completed benchmark run
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cgu-comparison-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  benchmark:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: depot-ubuntu-24.04-8
            architecture: x64
            uv-checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
          - target: aarch64-apple-darwin
            runner: namespace-profile-macos-15
            architecture: arm64
            uv-checksum: 50487ae565ccd96e499056b4674d438f4c53170202617b4c759defe0c6a1b544
          - target: x86_64-pc-windows-msvc
            runner: namespace-profile-windows-2022-x86-64-16x32
            architecture: x64
            uv-checksum: 75d05de6762778c31ee183398de7dd15093fad0ed90b1f236d8205ea5ec00c90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
      - name: Install LLVM profiling tools
        working-directory: ruff
        run: rustup component add llvm-tools-preview
      - name: Install memory sampler
        run: python -m pip install psutil==7.0.0
      - name: Download completed binaries
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cgu-comparison-${{ matrix.target }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cgu-comparison
      - name: Compare native PGO builds and runtime
        env:
          BENCHMARK_TARGET: ${{ matrix.target }}
          BENCHMARK_ROOT: ${{ runner.temp }}/cgu-comparison
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        shell: bash
        run: |
          runtime_args=()
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            runtime_args+=(--runtime-only)
          fi
          python -u scripts/compare_codegen_units.py --target "$BENCHMARK_TARGET" --output "$BENCHMARK_ROOT" "${runtime_args[@]}"
      - name: Upload evidence and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cgu-comparison-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cgu-comparison/evidence
            ${{ runner.temp }}/cgu-comparison/binaries
          retention-days: 30
