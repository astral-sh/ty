# Each day, build ty from Ruff's current `main` branch and a baseline selected
# by `scripts/prepare_daily_fuzz.py`. After the first run, the baseline is the
# `main` commit checked out by the most recently created scheduled run in the
# last seven days that completed and has an available artifact recording its
# commit; if none is found, the job fails.
#
# Run Ruff's py-fuzzer on the seeds 0-20,000 to find panics in the current ty
# that do not occur in the baseline. The workflow saves the checked-out `main`
# commit after fuzzing, even if the fuzzer finds a new panic.
# A failed or cancelled fuzz job opens an issue linking to the run, including
# when the job times out or fails during setup or building. When possible, the
# workflow creates the issue from the fuzzer's report, including reproducers.
#
# Note that if the previous run's artifact is missing or expired, or the cron job
# was belatedly triggered by GitHub, the baseline commit might sometimes be
# >24 hours old.

name: Daily fuzz

on:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  CARGO_PROFILE_PROFILING_DEBUG: line-tables-only

jobs:
  fuzz:
    name: Fuzz for new ty panics
    permissions:
      actions: read
      contents: read
    outputs:
      issue-report: ${{ steps.upload_report.outputs.artifact-id }}
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'depot-ubuntu-24.04-16' || 'ubuntu-latest' }}
    timeout-minutes: 180
    if: ${{ github.repository == 'astral-sh/ty' }}
    env:
      # Keep in sync with the job's timeout-minutes.
      FUZZ_JOB_TIMEOUT_MINUTES: 180
    steps:
      - name: Record job start time
        run: echo "FUZZ_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # py-fuzzer uses the tested binary's recorded commit in the generated
          # issue's reproduction instructions. If Ruff is checked out inside the
          # ty checkout, ty's build script records the ty repository's commit
          # instead of the tested Ruff commit, so the instructions point to the
          # wrong revision. Keep the checkouts side by side so the instructions
          # identify the tested Ruff commit.
          path: ty
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ruff
          ref: main
          path: ruff
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
      - name: Install Rust toolchain
        working-directory: ruff
        run: rustup show
      - name: Install mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ruff
      - name: Select Ruff commits
        id: commits
        working-directory: ty
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --script scripts/prepare_daily_fuzz.py --ruff-root ../ruff >> "$GITHUB_OUTPUT"
      - name: Build both versions of ty
        working-directory: ruff
        env:
          NEW_COMMIT: ${{ steps.commits.outputs.new_commit }}
          OLD_COMMIT: ${{ steps.commits.outputs.old_commit }}
        run: |
          echo "Testing $NEW_COMMIT against $OLD_COMMIT"
          git checkout --detach "$NEW_COMMIT"
          cargo build --locked --profile=profiling --bin=ty
          cp target/profiling/ty "$RUNNER_TEMP/ty-new"
          git checkout --detach "$OLD_COMMIT"
          cargo build --locked --profile=profiling --bin=ty
          cp target/profiling/ty "$RUNNER_TEMP/ty-old"
          git checkout --detach "$NEW_COMMIT"
      - name: Fuzz
        id: fuzz
        working-directory: ruff
        env:
          FORCE_COLOR: 1
        run: |
          budget_minutes=$(bash python/py-fuzzer/ci_budget.sh "$FUZZ_JOB_TIMEOUT_MINUTES")
          uv run \
            --python=3.14 \
            --project=./python/py-fuzzer \
            --locked \
            fuzz \
            --test-executable="$RUNNER_TEMP/ty-new" \
            --baseline-executable="$RUNNER_TEMP/ty-old" \
            --only-new-bugs \
            --bin=ty \
            --budget-minutes="${budget_minutes}" \
            --write-github-issue="$RUNNER_TEMP/fuzz-issue.md" \
            0-20000
      - name: Upload the fuzz report
        id: upload_report
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-fuzz-issue
          path: ${{ runner.temp }}/fuzz-issue.md
          if-no-files-found: ignore
      - name: Record Ruff commit to use as the next baseline
        id: next-baseline
        if: ${{ !cancelled() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure') }}
        working-directory: ruff
        run: git rev-parse HEAD > "$RUNNER_TEMP/ruff-head"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.next-baseline.outcome == 'success' }}
        with:
          name: daily-fuzz-ruff-head
          path: ${{ runner.temp }}/ruff-head
          if-no-files-found: error
          overwrite: true

  # The fuzz job runs third-party code, including build dependencies. Keep the
  # issue-writing token in a separate job so that code cannot access it. That code
  # could also alter the report, so use it only as issue text and never execute it.
  create-issue-on-failure:
    name: Report a failed fuzz run
    runs-on: ${{ github.repository == 'astral-sh/ty' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    needs: fuzz
    if: ${{ github.repository == 'astral-sh/ty' && always() && (needs.fuzz.result == 'failure' || needs.fuzz.result == 'cancelled') }}
    permissions:
      issues: write
    steps:
      - name: Download the fuzz report
        id: download_report
        if: ${{ needs.fuzz.outputs.issue-report != '' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-fuzz-issue
          path: ${{ runner.temp }}/fuzz-report
      - name: Create an issue for the failed fuzz run
        if: ${{ !cancelled() }}
        env:
          REPORT_DOWNLOAD_OUTCOME: ${{ steps.download_report.outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = {
              owner: "astral-sh",
              repo: "ty",
              title: "Daily ty fuzz failed",
              labels: ["bug", "fuzzer", "fatal"],
            };
            const fallbackBody = "This may indicate that a new panic or timeout was introduced in the last 24 hours. See the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.";
            const createIssue = (body) => github.rest.issues.create({ ...issue, body });

            if (process.env.REPORT_DOWNLOAD_OUTCOME === "success") {
              try {
                const report = require("node:fs").readFileSync(`${process.env.RUNNER_TEMP}/fuzz-report/fuzz-issue.md`, "utf8");
                await createIssue(report);
                return;
              } catch (error) {
                core.error(error);
                await createIssue(fallbackBody);
                throw error;
              }
            }
            await createIssue(fallbackBody);
