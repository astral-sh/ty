name: Prepare release
run-name: Probe Rooster with ty's read-only Actions token
on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    if: github.repository == 'astral-sh/ty' && github.ref == 'refs/heads/ee/dry-run-rooster-readonly-20261119'
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 5
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          enable-cache: false

      - name: Run Rooster's PR lookup in both repositories
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOSTER_NO_CACHE: "1"
        run: |
          uv run --isolated --no-project --python 3.12 --default-index https://pypi.org/simple \
            --with rooster==0.1.1 --with hishel==0.1.5 python - <<'PY'
          from types import SimpleNamespace

          from rooster._github import get_pull_requests_for_commits

          checks = (
              ("ty", "85b1fd0529bb76664ae04268458ce7fb83f6e3dc", 5073),
              ("ruff", "e1f6bf0d63ec2e4800fafaaf9e85d15391fc2978", 30510),
          )
          failures = []
          for repo, oid, number in checks:
              try:
                  prs = get_pull_requests_for_commits("astral-sh", repo, [SimpleNamespace(id=oid)])
                  match = next(pr for pr in prs if pr.number == number)
                  assert match.title and match.url
                  print(f"astral-sh/{repo}#{match.number}: read title, URL, author, and {len(match.labels)} labels")
              except Exception as error:
                  failures.append(repo)
                  print(f"astral-sh/{repo}#{number}: {type(error).__name__}: {error}")
          if failures:
              raise SystemExit(f"Rooster PR lookup failed for {', '.join(failures)}")
          PY
